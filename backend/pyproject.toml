[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "electrovision-backend"
version = "0.1.0"
description = "ElectroVision AI — Local-first Diagnostic Electrical Engineering & Computer Vision Backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "psycopg[binary]>=3.2.3,<4.0.0",
    "alembic>=1.14.0,<2.0.0",
    "pgvector>=0.3.6,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "structlog>=24.4.0,<26.0.0",
    "celery[redis]>=5.4.0,<6.0.0",
    "redis>=5.2.0,<6.0.0",
    "python-multipart>=0.0.17,<1.0.0",
    "pillow>=11.0.0,<12.0.0",
    "httpx>=0.28.0,<1.0.0",
    "sse-starlette>=2.1.3,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.5.0,<3.0.0",
    "ultralytics>=8.3.0,<9.0.0",
    "opencv-python-headless>=4.10.0,<5.0.0",
    "easyocr>=1.7.2,<2.0.0",
    "scikit-learn>=1.5.2,<2.0.0",
    "numpy>=1.26.4,<2.2.0",
    "pyyaml>=6.0.2,<7.0.0",
]
engine = [
    "ezdxf>=1.3.4,<2.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pandas>=2.2.3,<3.0.0",
    "onnxruntime>=1.20.0,<2.0.0",
    "tokenizers>=0.20.3,<1.0.0",
    "pypdf>=5.1.0,<6.0.0",
    "numpy>=1.26.4,<2.2.0",
]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "numpy>=1.26.4,<2.2.0",
    "opencv-python-headless>=4.10.0,<5.0.0",
    "pyyaml>=6.0.2,<7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/seeds/*.py" = ["E501"]
"app/services/cad_engine/unifilar_dxf.py" = ["E501"]
"app/services/compliance/deterministic_engine.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
